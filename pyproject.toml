[project]
name = "select-to-tts"
version = "0.1.0"
description = "Select text anywhere on Windows and hear it read aloud"
authors = [
    { name = "tzachbon", email = "tzachbonfil@gmail.com" }
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "aiortc>=1.15.0",
    "comtypes>=1.4.17",
    "edge-tts>=7.2.8",
    "pillow>=12.3.0",
    "pynput>=1.8.2",
    "pystray>=0.19.5",
    "sounddevice>=0.5.6",
    "uiautomation>=2.0.29",
]

[project.gui-scripts]
select-to-tts = "select_to_tts.__main__:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
