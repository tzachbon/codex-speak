name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings under General, for example "Harness Discussion 0.5.0". Write "source" if you run from a checkout.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows or macOS version
      description: On Windows, run `winver`, for example "Windows 11 24H2 (26100.4061)". On a Mac, see Apple menu > About This Mac, for example "macOS 15.5".
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Voice source that was reading
      description: Shown on the bar next to the speed menu.
      options:
        - Cursor
        - Codex
        - Edge
        - Windows
        - macOS
        - Not about speech
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App where you selected text
      description: For example Chrome, Notepad, VS Code, Word.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Paste the relevant lines from `%APPDATA%\harness-discussion\harness-discussion.log`
        (on a Mac, `~/Library/Application Support/harness-discussion/harness-discussion.log`).
        The log records engines, timing, and errors. It never contains the selected text.
      render: text
