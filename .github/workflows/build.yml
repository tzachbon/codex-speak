# Every successful master build publishes a versioned installer.
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && 'release' || github.ref }}
  queue: max

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv lock --check
      - name: Resolve release version
        id: version
        run: uv run --no-project python packaging/release_version.py
      - name: Stamp build metadata
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: uv version "$env:RELEASE_VERSION" --no-sync
      - run: uv sync --locked
      - name: Install Inno Setup if the runner lacks it
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: uv run python -m unittest discover -s tests
      - run: ./packaging/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CodexSpeak-Setup
          path: dist/CodexSpeak-Setup.exe
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: CodexSpeak-Setup
          path: dist
      - name: Publish tested installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: uv run --no-project python packaging/publish_release.py
