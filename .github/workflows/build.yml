# Tests and builds the installer on every push. A v* tag also publishes it as a GitHub release.
name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests
      - name: Install Inno Setup if the runner lacks it
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: ./packaging/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SelectToTTS-Setup
          path: dist/SelectToTTS-Setup.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/SelectToTTS-Setup.exe --title "Select to TTS ${{ github.ref_name }}" --generate-notes
